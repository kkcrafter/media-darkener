  <g fill="none" stroke="#000" stroke-width="2">
    <rect x="20" y="60" width="160" height="120"/>
    <rect x="240" y="50" width="160" height="140" fill="#eee"/>
    <rect x="460" y="60" width="160" height="120"/>
    <line x1="180" y1="120" x2="238" y2="120" marker-end="url(#a)"/>
    <line x1="400" y1="120" x2="458" y2="120" marker-end="url(#a)"/>
  </g>
  <text x="20" y="40" font-weight="bold" text-decoration="underline">Inputs</text>
  <text x="460" y="40" font-weight="bold" text-decoration="underline">Outputs</text>
